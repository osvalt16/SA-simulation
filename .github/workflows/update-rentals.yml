# .github/workflows/update-rentals.yml
# Met a jour rentals_data.json (contrats de location de flottes SRSLY on-chain).
# Le RPC public suffit pour ce petit programme ; SOLANA_RPC est utilise s'il existe.
name: Update Fleet Rentals

on:
  schedule:
    - cron: "15 */6 * * *"   # toutes les 6 heures
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-rentals
  cancel-in-progress: true

jobs:
  rentals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch rental contracts
        env:
          SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
        run: node scripts/fetch-rentals.js

      - name: Commit rentals_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rentals_data.json
          git diff --staged --quiet || git commit -m "Update fleet rentals [skip ci]"
          git push
